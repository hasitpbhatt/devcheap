  <g>
    <rect x="80" y="574" width="470" height="44" rx="22" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="106" y="602" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#E2E8F0">github.com/hasitpbhatt/awesome-ai-apps</text>
