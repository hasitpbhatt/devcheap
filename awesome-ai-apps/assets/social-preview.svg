    <text x="356" y="483" font-size="18" font-weight="600" fill="#E2E8F0">AI Coding</text>

    <rect x="560" y="452" width="216" height="50" rx="25" fill="#FFFFFF" opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="580" cy="477" r="5" fill="#34D399"/>
    <text x="596" y="483" font-size="18" font-weight="600" fill="#E2E8F0">Search &amp; Research</text>

    <rect x="800" y="452" width="216" height="50" rx="25" fill="#FFFFFF" opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="820" cy="477" r="5" fill="#F472B6"/>
    <text x="836" y="483" font-size="18" font-weight="600" fill="#E2E8F0">AI Writing</text>

    <rect x="1040" y="452" width="216" height="50" rx="25" fill="#FFFFFF" opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="1060" cy="477" r="5" fill="#FB923C"/>
    <text x="1076" y="483" font-size="18" font-weight="600" fill="#E2E8F0">AI Image</text>

    <rect x="80" y="516" width="216" height="50" rx="25" fill="#FFFFFF" opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="100" cy="541" r="5" fill="#F87171"/>
    <text x="116" y="547" font-size="18" font-weight="600" fill="#E2E8F0">AI Video</text>

    <rect x="320" y="516" width="216" height="50" rx="25" fill="#FFFFFF" opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="340" cy="541" r="5" fill="#60A5FA"/>
    <text x="356" y="547" font-size="18" font-weight="600" fill="#E2E8F0">Audio &amp; Voice</text>

    <rect x="560" y="516" width="216" height="50" rx="25" fill="#FFFFFF" opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="580" cy="541" r="5" fill="#FACC15"/>
    <text x="596" y="547" font-size="18" font-weight="600" fill="#E2E8F0">Productivity</text>

    <rect x="800" y="516" width="216" height="50" rx="25" fill="#FFFFFF" opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="820" cy="541" r="5" fill="#2DD4BF"/>
    <text x="836" y="547" font-size="18" font-weight="600" fill="#E2E8F0">Automation &amp; Agents</text>

    <rect x="1040" y="516" width="216" height="50" rx="25" fill="#FFFFFF" opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="1060" cy="541" r="5" fill="#E879F9"/>
    <text x="1076" y="547" font-size="18" font-weight="600" fill="#E2E8F0">Local &amp; Open Source</text>
