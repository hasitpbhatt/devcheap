  <text x="1200" y="602" text-anchor="end" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#94A3B8">MIT License · contributions welcome</text>
</svg>
