    <circle cx="0" cy="0" r="6" fill="#0F172A"/>
  </g>

  <text x="132" y="76" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5" fill="#F8FAFC">awesome-ai-apps</text>

  <text x="132" y="106" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" letter-spacing="0.2" fill="#C7D2FE">The best AI applications &amp; tools, curated</text>

  <g>
    <rect x="326" y="122" width="142" height="28" rx="14" fill="#FFFFFF" opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="397" y="140" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.3" fill="#E2E8F0">127 apps · 10 categories</text>
